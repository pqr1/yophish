<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yophish | Sign in</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="auth">
    <div class="auth-wrapper">
      <div class="auth-card">
        <h1 data-auth-heading>Welcome back</h1>
        <p class="auth-switch" data-switch-mode>Need an account? Create one instead.</p>

        <form id="loginForm">
          <div>
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="email" type="email" required />
          </div>
          <div>
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" required />
          </div>
          <button type="submit" style="width:100%">Log in</button>
        </form>

        <form id="signupForm" style="display:none">
          <div>
            <label for="signupName">Name</label>
            <input id="signupName" name="name" required />
          </div>
          <div>
            <label for="signupEmail">Email</label>
            <input id="signupEmail" name="email" type="email" required />
          </div>
          <div>
            <label for="signupPassword">Password</label>
            <input id="signupPassword" name="password" type="password" required />
          </div>
          <div>
            <label for="signupConfirmPassword">Confirm password</label>
            <input
              id="signupConfirmPassword"
              name="confirmPassword"
              type="password"
             
              required
            />
          </div>
          <div class="password-hint" id="passwordHint">
            <p>Password must include:</p>
            <ul>
              <li data-password-rule="length">At least 10 characters</li>
              <li data-password-rule="number">At least one number (0-9)</li>
              <li data-password-rule="lower">At least one lowercase letter (a-z)</li>
              <li data-password-rule="upper">At least one uppercase letter (A-Z)</li>
              <li data-password-rule="match">Passwords match</li>
            </ul>
          </div>
          <button type="submit" style="width:100%">Create account</button>
        </form>

      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
